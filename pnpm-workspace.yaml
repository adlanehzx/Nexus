packages:
  - "apps/*"
  - "services/*"
  - "packages/*"
  # Evaluations are regular workspace packages: they depend on the agent core
  # and tool layer, so pnpm must resolve them with the rest of the workspace.
  - "evals/*"

# Security floors for transitive dependencies.
#
# The vulnerable versions remained reachable even though their parent ranges
# already accepted fixed versions: only the lockfile was pinned too low. Keep
# explicit floors so a later lockfile regeneration cannot silently downgrade
# them and so the reason remains documented here.
#
#   proxy-addr  : IP spoofing through an IPv4-mapped IPv6 subnet
#                 (GHSA-jqcg-44mw-7w3h), reached by Express through the MCP SDK
#   shell-quote : command injection in `quote()` through a line terminator
#                 (GHSA-pqg4-j6r4-53mv), reached by React Native tooling
overrides:
  proxy-addr: "^2.0.8"
  shell-quote: "^1.11.0"

# pnpm blocks install scripts by default as a supply-chain safeguard. Only the
# packages that actually need them are allowed here. Every addition is a
# deliberate security decision.
#   prisma / @prisma/engines : downloads query engines
#   esbuild                  : native binary used by Vitest and tsx
allowBuilds:
  "@prisma/engines": true
  esbuild: true
  # CPU binaries ship in the package. The postinstall only downloads the large
  # GPU/CUDA runtimes, which NEXUS does not need.
  onnxruntime-node: false
  prisma: true
  # protobufjs does not need its postinstall at runtime; the published
  # JavaScript artifacts are already built. Blocking it preserves the closed
  # policy without breaking OTLP export.
  protobufjs: false

# pnpm rejects versions published fewer than N days ago by default. The
# versions below were explicitly reviewed and pinned.
minimumReleaseAgeExclude:
  - "@typescript-eslint/eslint-plugin@8.69.0"
  - "@typescript-eslint/parser@8.69.0"
  - "@typescript-eslint/project-service@8.69.0"
  - "@typescript-eslint/scope-manager@8.69.0"
  - "@typescript-eslint/tsconfig-utils@8.69.0"
  - "@typescript-eslint/type-utils@8.69.0"
  - "@typescript-eslint/types@8.69.0"
  - "@typescript-eslint/typescript-estree@8.69.0"
  - "@typescript-eslint/utils@8.69.0"
  - "@typescript-eslint/visitor-keys@8.69.0"
  - globals@17.12.0
  - typescript-eslint@8.69.0

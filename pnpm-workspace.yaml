packages:
  - "apps/*"
  - "services/*"
  - "packages/*"
  - "mcp/*"
  # Les évaluations sont un paquet comme un autre : elles dépendent du cœur
  # agent et de la couche d'outils, et doivent donc être résolues par pnpm.
  - "evals/*"

# Planchers de sécurité sur des dépendances transitives.
#
# Les deux versions vulnérables étaient atteignables alors que les plages
# déclarées par leurs parents acceptaient déjà les versions corrigées : seul le
# verrou était figé plus bas. Un plancher explicite plutôt qu'une simple mise à
# jour du verrou, pour qu'une régénération ultérieure ne puisse pas redescendre
# en silence — et pour que la raison soit lisible ici.
#
#   proxy-addr  : usurpation d'IP via un sous-réseau IPv6 mappant IPv4
#                 (GHSA-jqcg-44mw-7w3h), atteint par express via le SDK MCP
#   shell-quote : injection de commande dans `quote()` via un terminateur de
#                 ligne (GHSA-pqg4-j6r4-53mv), atteint par l'outillage de
#                 développement React Native
overrides:
  proxy-addr: "^2.0.8"
  shell-quote: "^1.11.0"

# pnpm bloque les scripts d'installation par défaut (protection chaîne
# d'approvisionnement). On autorise explicitement les seuls paquets qui en ont
# réellement besoin — tout ajout ici est une décision, pas une formalité.
#   prisma / @prisma/engines : téléchargement des moteurs de requête
#   esbuild                  : binaire natif utilisé par vitest et tsx
allowBuilds:
  "@prisma/engines": true
  esbuild: true
  prisma: true
  # protobufjs : le postinstall n'est pas necessaire a l'execution ; les
  # artefacts JavaScript distribues sont deja construits. Le refuser garde la
  # politique fermée sans casser l'export OTLP.
  protobufjs: false

# pnpm refuse par défaut les versions publiées depuis moins de N jours. Les
# versions ci-dessous ont été explicitement vérifiées et épinglées.
minimumReleaseAgeExclude:
  - "@typescript-eslint/eslint-plugin@8.69.0"
  - "@typescript-eslint/parser@8.69.0"
  - "@typescript-eslint/project-service@8.69.0"
  - "@typescript-eslint/scope-manager@8.69.0"
  - "@typescript-eslint/tsconfig-utils@8.69.0"
  - "@typescript-eslint/type-utils@8.69.0"
  - "@typescript-eslint/types@8.69.0"
  - "@typescript-eslint/typescript-estree@8.69.0"
  - "@typescript-eslint/utils@8.69.0"
  - "@typescript-eslint/visitor-keys@8.69.0"
  - globals@17.12.0
  - typescript-eslint@8.69.0

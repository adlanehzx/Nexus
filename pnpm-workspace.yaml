packages:
  - "apps/*"
  - "services/*"
  - "packages/*"
  - "mcp/*"

# pnpm bloque les scripts d'installation par défaut (protection chaîne
# d'approvisionnement). On autorise explicitement les seuls paquets qui en ont
# réellement besoin — tout ajout ici est une décision, pas une formalité.
#   prisma / @prisma/engines : téléchargement des moteurs de requête
#   esbuild                  : binaire natif utilisé par vitest et tsx
allowBuilds:
  "@prisma/engines": true
  esbuild: true
  prisma: true

# pnpm refuse par défaut les versions publiées depuis moins de N jours. Les
# versions ci-dessous ont été explicitement vérifiées et épinglées.
minimumReleaseAgeExclude:
  - "@typescript-eslint/eslint-plugin@8.69.0"
  - "@typescript-eslint/parser@8.69.0"
  - "@typescript-eslint/project-service@8.69.0"
  - "@typescript-eslint/scope-manager@8.69.0"
  - "@typescript-eslint/tsconfig-utils@8.69.0"
  - "@typescript-eslint/type-utils@8.69.0"
  - "@typescript-eslint/types@8.69.0"
  - "@typescript-eslint/typescript-estree@8.69.0"
  - "@typescript-eslint/utils@8.69.0"
  - "@typescript-eslint/visitor-keys@8.69.0"
  - globals@17.12.0
  - typescript-eslint@8.69.0

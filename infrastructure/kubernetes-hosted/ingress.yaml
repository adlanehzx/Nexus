apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nexus-hosted
  namespace: nexus
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - nexus.example.invalid
        - api.nexus.example.invalid
      secretName: nexus-hosted-tls
  rules:
    - host: nexus.example.invalid
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nexus-dashboard
                port: { name: http }
    - host: api.nexus.example.invalid
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port: { name: http }

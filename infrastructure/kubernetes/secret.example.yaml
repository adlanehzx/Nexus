# MODELE UNIQUEMENT — copier en secret.yaml (ignore par Git) et remplacer les
# valeurs. Ne jamais committer la copie remplie.
apiVersion: v1
kind: Secret
metadata:
  name: nexus-secrets
  namespace: nexus
type: Opaque
stringData:
  postgres-password: CHANGE_ME_WITH_A_RANDOM_PASSWORD
  database-url: postgresql://nexus:CHANGE_ME_WITH_A_RANDOM_PASSWORD@nexus-postgres:5432/nexus?schema=public
  # Ajouter `auth-signing-key` avec une vraie cle Ed25519 PEM avant production.
  # La laisser absente active une cle ephemere ; une chaine vide ferait refuser
  # le demarrage, ce qui evite une fausse impression de persistance.

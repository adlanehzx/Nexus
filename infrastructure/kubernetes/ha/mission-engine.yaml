apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-mission-engine
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 1, maxSurge: 1 }
  selector:
    matchLabels: { app: nexus-mission-engine }
  template:
    metadata:
      labels: { app: nexus-mission-engine }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: { app: nexus-mission-engine }
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/region
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: nexus-mission-engine }
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: nexus-mission-engine }
      containers:
        - name: mission-engine
          image: nexus-mission-engine:local
          env:
            - { name: NEXUS_ENGINE_HOST, value: "0.0.0.0" }
            - { name: NEXUS_ENGINE_PORT, value: "8000" }
            - { name: NEXUS_ENGINE_WORKER_ENABLED, value: "true" }
            - { name: NEXUS_ENGINE_WORKER_CONCURRENCY, value: "2" }
            - { name: NEXUS_ENGINE_SCHEDULER_ENABLED, value: "true" }
            - { name: NEXUS_ENGINE_API_URL, value: "http://api:3000" }
            - name: NEXUS_ENGINE_DATABASE_URL
              valueFrom:
                secretKeyRef: { name: nexus-secrets, key: mission-engine-database-url }
          ports: [{ name: http, containerPort: 8000 }]
          readinessProbe:
            httpGet: { path: /v1/health/ready, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /v1/health/live, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "2", memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata:
  name: nexus-mission-engine
spec:
  selector: { app: nexus-mission-engine }
  ports: [{ name: http, port: 8000, targetPort: http }]

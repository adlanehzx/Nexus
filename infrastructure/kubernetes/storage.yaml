apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-cache
  namespace: nexus
spec:
  accessModes: [ReadWriteMany]
  resources:
    requests:
      storage: 4Gi
---
# Runtime configuration and caches use operator-provided shared storage in HA mode.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: api-state
  namespace: nexus
spec:
  accessModes: [ReadWriteMany]
  resources:
    requests:
      storage: 5Gi

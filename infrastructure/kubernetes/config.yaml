apiVersion: v1
kind: ConfigMap
metadata:
  name: nexus-config
  namespace: nexus
data:
  NODE_ENV: production
  LOG_LEVEL: info
  API_HOST: 0.0.0.0
  API_PORT: "3000"
  METRICS_ENABLED: "true"
  METRICS_HOST: 0.0.0.0
  METRICS_PORT: "9464"
  CORS_ORIGINS: https://nexus.example.invalid
  # Adresse HTTPS joignable par les workers ; requise pour emettre un ticket.
  PUBLIC_API_URL: https://nexus.example.invalid
  REDIS_URL: redis://nexus-redis:6379
  MEMORY_EMBEDDING_BACKEND: neural
  MEMORY_EMBEDDING_CACHE_DIR: /var/lib/nexus/models
  MEMORY_EMBEDDING_LOCAL_ONLY: "false"
  NEXUS_RUNTIME_CONFIG_DIR: /var/lib/nexus/runtime-config
  NEXUS_BROWSER_ARTIFACTS_DIR: /var/lib/nexus/artifacts/browser
  NEXUS_OBSERVABILITY_DIR: /var/lib/nexus/observability
  # URL HTTPS privée du Mission Engine qui reste près des agents ACP.
  MISSION_CONTROL_URL: ""

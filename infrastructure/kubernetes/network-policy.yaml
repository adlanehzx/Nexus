apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: database-only-from-nexus
  namespace: nexus
spec:
  podSelector:
    matchExpressions:
      - { key: app, operator: In, values: [nexus-postgres, nexus-redis] }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - { key: app, operator: In, values: [nexus-api] }

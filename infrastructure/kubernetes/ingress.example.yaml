# k3s/Traefik example. Copy to ingress.yaml, replace the domain and TLS secret,
# then apply separately. One dashboard origin proxies /api and /ws to the API.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nexus
  namespace: nexus
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  tls:
    - hosts: [nexus.example.invalid]
      secretName: nexus-tls
  rules:
    - host: nexus.example.invalid
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nexus-dashboard
                port: { name: http }

name: nexus-activepieces

# Déploiement local isolé d'Activepieces pour NEXUS.
#
# Caractéristiques d'isolation :
# - Boucle locale stricte 127.0.0.1 (aucune exposition réseau extérieur ni tailnet).
# - Base de données PostgreSQL dédiée isolée ou partagée sur le réseau interne conteneur.
# - Clés d'encryption et secrets JWT gérés en local.

services:
  activepieces:
    image: activepieces/activepieces:0.39.2
    container_name: nexus-activepieces
    restart: unless-stopped
    ports:
      # Boucle locale uniquement
      - "127.0.0.1:8080:80"
    environment:
      AP_ENVIRONMENT: "production"
      AP_FRONTEND_URL: "http://127.0.0.1:8080"
      AP_WEBHOOK_TIMEOUT_SECONDS: "30"
      AP_ENCRYPTION_KEY: "${AP_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef}"
      AP_JWT_SECRET: "${AP_JWT_SECRET:-nexus_activepieces_jwt_secret_dev}"
      AP_POSTGRES_HOST: "postgres"
      AP_POSTGRES_PORT: "5432"
      AP_POSTGRES_DATABASE: "activepieces"
      AP_POSTGRES_USERNAME: "${POSTGRES_USER:-nexus}"
      AP_POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-nexus_dev_password}"
    networks:
      - nexus

networks:
  nexus:
    external: true

use_default_settings: true

general:
  debug: false
  instance_name: "NEXUS Search"
  enable_metrics: false

search:
  safe_search: 1
  autocomplete: ""
  formats:
    - html
    - json

server:
  # The official container overrides this value with SEARXNG_SECRET.
  secret_key: "ultrasecretkey"
  limiter: false
  image_proxy: false
  public_instance: false

ui:
  static_use_hash: true

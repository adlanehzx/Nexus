# NEXUS — Mosquitto broker (Lab 4, optional `mqtt` profile).
# Anonymous access is disabled: create the password file before first start
#   docker compose -f infrastructure/docker/docker-compose.yml --profile mqtt \
#     run --rm mosquitto mosquitto_passwd -c /mosquitto/auth/passwd nexus
listener 1883
allow_anonymous false
password_file /mosquitto/auth/passwd
persistence true
persistence_location /mosquitto/data/
log_dest stdout

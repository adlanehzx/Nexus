name: nexus

# Local development stack: PostgreSQL, Redis, and API.
#
# Launch from the repository root:
#   pnpm docker:up          (equivalent to docker compose -f infrastructure/docker/docker-compose.yml up -d)
#
# Paths are relative to THIS file; repository root is ../..

services:
  postgres:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d}
    container_name: nexus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexus_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-nexus}
      # C collation ensures deterministic sorting across machines and versions.
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=en-US --encoding=UTF8"
    ports:
      # Localhost loopback only. Published across all interfaces, the database
      # would become accessible on LAN/tailnet. No client or worker connects to
      # the database directly: they communicate via the Core, which connects over
      # the internal Docker bridge under the hostname `postgres`. Only local tools
      # (Prisma migrations, Studio) use this published port.
      #
      # Port 15432 instead of 5432 to avoid collision if 5432 is already bound locally.
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # `pg_isready` alone may report ready before full initialization:
      # we explicitly probe the target database.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexus} -d ${POSTGRES_DB:-nexus}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [nexus]

  redis:
    image: redis:7-alpine
    container_name: nexus-redis
    restart: unless-stopped
    # AOF `everysec`: job queues survive restarts without the cost of fsync on every write.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      # Localhost loopback only: Redis has no authentication password in local dev.
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [nexus]

  migrate:
    build:
      context: ../..
      dockerfile: infrastructure/docker/migrate.Dockerfile
    container_name: nexus-migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-nexus}:${POSTGRES_PASSWORD:-nexus_dev_password}@postgres:5432/${POSTGRES_DB:-nexus}?schema=public
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [nexus]

  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/api.Dockerfile
    container_name: nexus-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Host networking is deliberate for the personal/local deployment: ACP
      # CLIs, Mission Engine and Chromium stay on host loopback and are never
      # copied into the container. The API itself also binds loopback only.
      API_HOST: ${API_HOST:-127.0.0.1}
      API_PORT: 3000
      API_VERSION: ${API_VERSION:-1.0.0}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      METRICS_HOST: 127.0.0.1
      METRICS_PORT: 9464
      OTEL_SERVICE_NAME: nexus-api
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      MODEL_PRICING_JSON: ${MODEL_PRICING_JSON:-}
      MEMORY_EMBEDDING_BACKEND: ${MEMORY_EMBEDDING_BACKEND:-neural}
      MEMORY_EMBEDDING_MODEL: ${MEMORY_EMBEDDING_MODEL:-Xenova/paraphrase-multilingual-MiniLM-L12-v2}
      MEMORY_EMBEDDING_CACHE_DIR: /var/lib/nexus/models
      MEMORY_EMBEDDING_LOCAL_ONLY: ${MEMORY_EMBEDDING_LOCAL_ONLY:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080,http://localhost:5274}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-}
      AUTH_SIGNING_KEY: ${AUTH_SIGNING_KEY:?AUTH_SIGNING_KEY is required}
      MASTER_KEY: ${MASTER_KEY:?MASTER_KEY is required}
      MISSION_CONTROL_URL: ${MISSION_CONTROL_URL:-http://127.0.0.1:18100}
      BU_CDP_URL: ${BU_CDP_URL:-http://127.0.0.1:19222}
      NEXUS_RUNTIME_CONFIG_DIR: /var/lib/nexus/runtime-config
      NEXUS_BROWSER_ARTIFACTS_DIR: /var/lib/nexus/artifacts/browser
      NEXUS_OBSERVABILITY_DIR: /var/lib/nexus/observability
      SHUTDOWN_TIMEOUT_MS: ${SHUTDOWN_TIMEOUT_MS:-10000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-1 minute}
      SATELLITE_TOKEN_HASHES_JSON: ${SATELLITE_TOKEN_HASHES_JSON:-{}}
      FIRE_TV_ADB_SERIAL: ${FIRE_TV_ADB_SERIAL:-}
      FIRE_TV_ADB_SERVER: ${FIRE_TV_ADB_SERVER:-127.0.0.1:5037}
      # With host networking, local dependencies remain reachable only through
      # their loopback-published ports.
      DATABASE_URL: postgresql://${POSTGRES_USER:-nexus}:${POSTGRES_PASSWORD:-nexus_dev_password}@127.0.0.1:${POSTGRES_PORT:-15432}/${POSTGRES_DB:-nexus}?schema=public
      REDIS_URL: redis://127.0.0.1:${REDIS_PORT:-6379}
      BROWSER_WORKER_URL: http://127.0.0.1:${BROWSER_WORKER_PORT:-18110}
      BROWSER_WORKER_TOKEN: ${BROWSER_WORKER_TOKEN:-}
      SEARXNG_URL: ${SEARXNG_URL:-http://127.0.0.1:18080}
      SEARXNG_TIMEOUT_MS: ${SEARXNG_TIMEOUT_MS:-15000}
    network_mode: host
    volumes:
      - nexus-models:/var/lib/nexus/models
      - nexus-runtime-config:/var/lib/nexus/runtime-config
      - nexus-artifacts:/var/lib/nexus/artifacts
      - nexus-observability:/var/lib/nexus/observability
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /home/node:size=128m,mode=0700,uid=1000,gid=1000
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # Graceful shutdown includes safety margin beyond timeout.
    stop_grace_period: 15s

  dashboard:
    build:
      context: ../..
      dockerfile: infrastructure/docker/dashboard.Dockerfile
    container_name: nexus-dashboard
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    # Share the host network so nginx can reach the API that is deliberately
    # bound to 127.0.0.1. This keeps both surfaces local-only without exposing
    # the API on a bridge address.
    network_mode: host
    environment:
      DASHBOARD_PORT: ${DASHBOARD_PORT:-8080}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${DASHBOARD_PORT}/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /etc/nginx/conf.d:size=1m,mode=0755,uid=101,gid=101
      - /var/cache/nginx:size=16m,mode=0755
      - /var/run:size=1m,mode=0755
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.7.3}
    container_name: nexus-prometheus
    restart: unless-stopped
    profiles: [observability]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    security_opt: [no-new-privileges:true]
    networks: [nexus]

  loki:
    image: ${LOKI_IMAGE:-grafana/loki:3.7.0}
    container_name: nexus-loki
    restart: unless-stopped
    profiles: [observability]
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./observability/loki.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    expose: ["3100"]
    security_opt: [no-new-privileges:true]
    networks: [nexus]

  tempo:
    image: ${TEMPO_IMAGE:-grafana/tempo:2.9.0}
    container_name: nexus-tempo
    restart: unless-stopped
    profiles: [observability]
    command: ["-config.file=/etc/tempo/config.yml"]
    volumes:
      - ./observability/tempo.yml:/etc/tempo/config.yml:ro
      - tempo-data:/var/tempo
    expose: ["3200", "4317", "4318"]
    security_opt: [no-new-privileges:true]
    networks: [nexus]

  otel-collector:
    image: ${OTEL_COLLECTOR_IMAGE:-otel/opentelemetry-collector-contrib:0.140.0}
    container_name: nexus-otel-collector
    restart: unless-stopped
    profiles: [observability]
    command: ["--config=/etc/otelcol/config.yml"]
    depends_on: [tempo]
    volumes:
      - ./observability/otel-collector.yml:/etc/otelcol/config.yml:ro
    expose: ["4317", "4318"]
    security_opt: [no-new-privileges:true]
    networks: [nexus]

  alloy:
    image: ${ALLOY_IMAGE:-grafana/alloy:v1.11.3}
    container_name: nexus-alloy
    restart: unless-stopped
    profiles: [observability]
    command: ["run", "/etc/alloy/config.alloy", "--storage.path=/var/lib/alloy"]
    depends_on: [loki]
    volumes:
      - ./observability/config.alloy:/etc/alloy/config.alloy:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - alloy-data:/var/lib/alloy
    security_opt: [no-new-privileges:true]
    networks: [nexus]

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:12.3.5}
    container_name: nexus-grafana
    restart: unless-stopped
    profiles: [observability]
    depends_on: [prometheus, loki, tempo]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-nexus-local-observability}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3300}:3000"
    security_opt: [no-new-privileges:true]
    networks: [nexus]

  searxng:
    # Multi-arch pinned digest for reproducibility. SEARXNG_IMAGE allows explicit upgrades.
    image: ${SEARXNG_IMAGE:-docker.io/searxng/searxng@sha256:5ed0323b5f5f8701264ef65e239a2bd83cb57098f2b971fa30bf79c06eeae271}
    container_name: nexus-searxng
    restart: unless-stopped
    profiles: [research]
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-nexus-local-private-instance}
      SEARXNG_BASE_URL: http://searxng:8080/
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    expose:
      - "8080"
    ports:
      # Localhost loopback only: API running on host connects here.
      - "127.0.0.1:${SEARXNG_PORT:-18080}:8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- --post-data='q=health&format=json' http://127.0.0.1:8080/search >/dev/null",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    networks: [nexus]

  browser-worker:
    build:
      context: ../..
      dockerfile: infrastructure/docker/browser-worker.Dockerfile
    container_name: nexus-browser-worker
    restart: unless-stopped
    # Optional profile: image packages Chromium (~1.5 GB). Launch with: pnpm docker:browser
    profiles: [browser]
    environment:
      # Browser worker requires a token (validated at startup).
      BROWSER_WORKER_AUTH_TOKEN: ${BROWSER_WORKER_TOKEN:-}
      BROWSER_WORKER_LLM_API_KEY: ${LLM_API_KEY:-}
      BROWSER_WORKER_LLM_MODEL: ${BROWSER_WORKER_LLM_MODEL:-claude-sonnet-4-5}
      BROWSER_WORKER_HEADLESS: "true"
      BROWSER_WORKER_MAX_SESSIONS: ${BROWSER_WORKER_MAX_SESSIONS:-3}
      BROWSER_WORKER_LOG_LEVEL: ${LOG_LEVEL:-info}
    # NO published ports: worker is reachable only from internal Docker network.
    # It visits untrusted web content and must never be exposed externally.
    expose:
      - "8100"
    ports:
      - "127.0.0.1:${BROWSER_WORKER_PORT:-18110}:8100"
    # Chromium requires shared memory; 64MB default causes crashes on complex pages.
    shm_size: 1gb
    mem_limit: 2g
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    networks: [nexus]

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  loki-data:
  tempo-data:
  alloy-data:
  grafana-data:
  nexus-models:
  nexus-runtime-config:
  nexus-artifacts:
  nexus-observability:

networks:
  nexus:
    driver: bridge

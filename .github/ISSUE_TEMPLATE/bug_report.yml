name: Bug report
description: Report reproducible behavior without sensitive data
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: For a vulnerability, use the private reporting process described in SECURITY.md.
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: Describe the result without pasting tokens, cookies, or .env files.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      placeholder: Commands, a synthetic mission, and redacted logs
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: NEXUS version or commit
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options: [Linux, Windows, macOS, Android, iOS, Docker, Other]
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Sensitive data
      options:
        - label: I removed all secrets, tokens, cookies, and personal data.
          required: true

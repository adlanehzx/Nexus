name: Rapport de bug
description: Signaler un comportement reproductible sans donnée sensible
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Pour une vulnérabilité, utilisez le signalement privé décrit dans SECURITY.md.
  - type: textarea
    id: observed
    attributes:
      label: Comportement observé
      description: Décrivez le résultat sans coller de jeton, cookie ou fichier .env.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction minimale
      placeholder: Commandes, mission factice et journaux expurgés
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version ou commit NEXUS
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environnement
      options: [Linux, Windows, macOS, Android, iOS, Docker, Autre]
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Données sensibles
      options:
        - label: J'ai retiré tous les secrets, jetons, cookies et données personnelles.
          required: true

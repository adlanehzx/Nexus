# Reproducible API publishing and installable client packages.
# Packages remain buildable without signing secrets and are clearly marked unsigned.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish (vX.Y.Z)
        required: true
        type: string
      signer:
        description: "Sign client packages when signing secrets are configured"
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  validate:
    name: Revalidate source
    uses: ./.github/workflows/ci.yml

  publish:
    name: Images, SBOMs, and signatures
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Validate tag and image names
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$REQUESTED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid tag: $REQUESTED_TAG" >&2
            exit 1
          fi
          echo "RELEASE_TAG=$REQUESTED_TAG" >> "$GITHUB_ENV"
          echo "API_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/api" >> "$GITHUB_ENV"
          echo "DASHBOARD_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/dashboard" >> "$GITHUB_ENV"
          echo "MIGRATE_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/migrate" >> "$GITHUB_ENV"
          echo "WORKER_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/worker" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish API
        id: api-image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/api.Dockerfile
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ env.RELEASE_TAG }}
            ${{ env.API_IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          provenance: mode=max
          sbom: true

      - name: Build and publish dashboard
        id: dashboard-image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/dashboard.Dockerfile
          push: true
          tags: |
            ${{ env.DASHBOARD_IMAGE }}:${{ env.RELEASE_TAG }}
            ${{ env.DASHBOARD_IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          provenance: mode=max
          sbom: true

      - name: Build and publish migrator
        id: migrate-image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/migrate.Dockerfile
          push: true
          tags: |
            ${{ env.MIGRATE_IMAGE }}:${{ env.RELEASE_TAG }}
            ${{ env.MIGRATE_IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          provenance: mode=max
          sbom: true

      - name: Build and publish multi-architecture Linux worker
        id: worker-image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/worker.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.WORKER_IMAGE }}:${{ env.RELEASE_TAG }}
            ${{ env.WORKER_IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          provenance: mode=max
          sbom: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign images without a static key
        env:
          API_DIGEST: ${{ steps.api-image.outputs.digest }}
          DASHBOARD_DIGEST: ${{ steps.dashboard-image.outputs.digest }}
          MIGRATE_DIGEST: ${{ steps.migrate-image.outputs.digest }}
          WORKER_DIGEST: ${{ steps.worker-image.outputs.digest }}
        run: |
          cosign sign --yes "$API_IMAGE@$API_DIGEST"
          cosign sign --yes "$DASHBOARD_IMAGE@$DASHBOARD_DIGEST"
          cosign sign --yes "$MIGRATE_IMAGE@$MIGRATE_DIGEST"
          cosign sign --yes "$WORKER_IMAGE@$WORKER_DIGEST"

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate release artifacts
        run: |
          git archive --format=tar.gz --prefix="nexus-${RELEASE_TAG}/" \
            --output="nexus-${RELEASE_TAG}.tar.gz" "$RELEASE_TAG"
          syft "$API_IMAGE@${{ steps.api-image.outputs.digest }}" \
            --output "spdx-json=nexus-${RELEASE_TAG}-api.sbom.spdx.json"
          syft "$DASHBOARD_IMAGE@${{ steps.dashboard-image.outputs.digest }}" \
            --output "spdx-json=nexus-${RELEASE_TAG}-dashboard.sbom.spdx.json"
          syft "$MIGRATE_IMAGE@${{ steps.migrate-image.outputs.digest }}" \
            --output "spdx-json=nexus-${RELEASE_TAG}-migrate.sbom.spdx.json"
          syft "$WORKER_IMAGE@${{ steps.worker-image.outputs.digest }}" \
            --output "spdx-json=nexus-${RELEASE_TAG}-worker.sbom.spdx.json"
          cp packaging/linux/install-worker.sh install-worker.sh
          sha256sum "nexus-${RELEASE_TAG}.tar.gz" \
            "nexus-${RELEASE_TAG}-api.sbom.spdx.json" \
            "nexus-${RELEASE_TAG}-dashboard.sbom.spdx.json" \
            "nexus-${RELEASE_TAG}-migrate.sbom.spdx.json" \
            "nexus-${RELEASE_TAG}-worker.sbom.spdx.json" \
            install-worker.sh > SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$RELEASE_TAG" \
            "nexus-${RELEASE_TAG}.tar.gz" \
            "nexus-${RELEASE_TAG}-api.sbom.spdx.json" \
            "nexus-${RELEASE_TAG}-dashboard.sbom.spdx.json" \
            "nexus-${RELEASE_TAG}-migrate.sbom.spdx.json" \
            "nexus-${RELEASE_TAG}-worker.sbom.spdx.json" \
            install-worker.sh \
            SHA256SUMS \
            --verify-tag \
            --generate-notes \
            --title "NEXUS ${RELEASE_TAG}"

  desktop:
    name: Desktop — ${{ matrix.label }}
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      # A macOS failure must not prevent Linux or Windows artifacts.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux (AppImage, deb)
            bundles: appimage,deb
          - os: windows-latest
            label: Windows (MSI, NSIS)
            bundles: msi,nsis
          - os: macos-latest
            label: macOS (dmg)
            bundles: dmg

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      # WebKitGTK system dependencies required by the Linux build.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf \
            libsecret-1-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build monorepo
        run: pnpm build

      - name: Build packages
        run: pnpm --filter @nexus/desktop exec tauri build --bundles ${{ matrix.bundles }}
        env:
          # Windows code signing. Without these values, the package remains unsigned.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS signing and notarization follow the same rule.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Report artifacts and signing status
        shell: bash
        run: |
          echo "## Packages — ${{ matrix.label }}" >> "$GITHUB_STEP_SUMMARY"
          find apps/desktop/src-tauri/target/release/bundle -type f \
            \( -name '*.AppImage' -o -name '*.deb' -o -name '*.msi' -o -name '*.exe' -o -name '*.dmg' \) \
            -printf '%f\t%s bytes\n' 2>/dev/null \
            | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY" || true
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ] && [ -z "${APPLE_CERTIFICATE:-}" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**UNSIGNED packages**: no signing secret was provided." >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}

      # The worker is a headless Node daemon and has its own installer.
      - name: Build worker installer
        if: runner.os == 'Windows'
        working-directory: packaging/windows
        shell: bash
        run: |
          VERSION="$(node -p "require('../../apps/desktop/src-tauri/tauri.conf.json').version")"
          makensis -DVERSION="$VERSION" nexus-worker.nsi

      - uses: actions/upload-artifact@v4
        with:
          name: nexus-worker-installer
          path: packaging/windows/*-setup.exe
          if-no-files-found: ignore
        if: runner.os == 'Windows'

      - uses: actions/upload-artifact@v4
        with:
          name: nexus-desktop-${{ runner.os }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/**/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/**/*.deb
            apps/desktop/src-tauri/target/release/bundle/**/*.msi
            apps/desktop/src-tauri/target/release/bundle/**/*-setup.exe
            apps/desktop/src-tauri/target/release/bundle/**/*.dmg
          if-no-files-found: error

  android:
    name: Android (APK)
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build monorepo
        run: pnpm build

      # Decode the optional keystore only inside the runner workspace.
      - name: Provision keystore when available
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/nexus-release.jks"
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        working-directory: services/android-worker/android
        env:
          NEXUS_KEYSTORE_PATH: ${{ runner.temp }}/nexus-release.jks
          NEXUS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NEXUS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NEXUS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # One Gradle command handles both signed and unsigned builds from the environment.
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Report APK signing status
        run: |
          echo "## Android" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.keystore.outputs.present }}" = "true" ]; then
            echo "- APK **signed** with the supplied keystore." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **UNSIGNED APK**: no keystore supplied; not installable on a device." >> "$GITHUB_STEP_SUMMARY"
          fi
          find . -name '*.apk' -printf '  - %f\t%s bytes\n' >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        with:
          name: nexus-android-apk
          path: services/android-worker/android/**/*.apk
          if-no-files-found: error

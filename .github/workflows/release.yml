# Publication reproductible de l'API et paquets installables des clients.
# Les paquets restent générables sans secrets de signature afin que la chaîne
# soit testable ; ils sont alors explicitement signalés comme non signés.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag existant à publier (vX.Y.Z)
        required: true
        type: string
      signer:
        description: "Signer les paquets clients lorsque les secrets sont configurés"
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  validate:
    name: Revalider la source
    uses: ./.github/workflows/ci.yml

  publish:
    name: Image, SBOM et signature
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Valider le tag et le nom d'image
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$REQUESTED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag invalide: $REQUESTED_TAG" >&2
            exit 1
          fi
          echo "RELEASE_TAG=$REQUESTED_TAG" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/api" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Se connecter à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et publier l'API
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/api.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.RELEASE_TAG }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          provenance: mode=max
          sbom: true

      - name: Installer Cosign
        uses: sigstore/cosign-installer@v3

      - name: Signer l'image sans clé statique
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - name: Installer Syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Générer les artefacts de release
        run: |
          git archive --format=tar.gz --prefix="nexus-${RELEASE_TAG}/" \
            --output="nexus-${RELEASE_TAG}.tar.gz" "$RELEASE_TAG"
          syft "$IMAGE@${{ steps.image.outputs.digest }}" \
            --output "spdx-json=nexus-${RELEASE_TAG}.sbom.spdx.json"
          sha256sum "nexus-${RELEASE_TAG}.tar.gz" \
            "nexus-${RELEASE_TAG}.sbom.spdx.json" > SHA256SUMS

      - name: Publier la release GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$RELEASE_TAG" \
            "nexus-${RELEASE_TAG}.tar.gz" \
            "nexus-${RELEASE_TAG}.sbom.spdx.json" \
            SHA256SUMS \
            --verify-tag \
            --generate-notes \
            --title "NEXUS ${RELEASE_TAG}"

  desktop:
    name: Bureau — ${{ matrix.label }}
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      # `fail-fast: false` : un échec sur macOS ne doit pas priver de
      # l'AppImage, qui est peut-être la seule dont on a besoin aujourd'hui.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux (AppImage, deb)
            bundles: appimage,deb
          - os: windows-latest
            label: Windows (MSI, NSIS)
            bundles: msi,nsis
          - os: macos-latest
            label: macOS (dmg)
            bundles: dmg

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      # Dépendances système de WebKitGTK. Sans elles, la compilation échoue sur
      # une erreur de `pkg-config` qui ne nomme pas le paquet manquant.
      - name: Dépendances Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf \
            libsecret-1-dev

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Build du monorepo
        run: pnpm build

      - name: Construire les paquets
        run: pnpm --filter @nexus/desktop exec tauri build --bundles ${{ matrix.bundles }}
        env:
          # Signature de code Windows. Absents, le paquet est produit non signé.
          # Les secrets ne sont jamais écrits dans un fichier du dépôt.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Signature et notarisation macOS, mêmes règles.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Dire ce qui a été produit, et si c'est signé
        shell: bash
        run: |
          echo "## Paquets — ${{ matrix.label }}" >> "$GITHUB_STEP_SUMMARY"
          find apps/desktop/src-tauri/target/release/bundle -type f \
            \( -name '*.AppImage' -o -name '*.deb' -o -name '*.msi' -o -name '*.exe' -o -name '*.dmg' \) \
            -printf '%f\t%s octets\n' 2>/dev/null \
            | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY" || true
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ] && [ -z "${APPLE_CERTIFICATE:-}" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**Paquets NON SIGNÉS** : aucun secret de signature fourni." >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}

      # L'installateur du worker, qui n'est pas la coquille de bureau : un démon
      # Node sans interface, qui doit tourner sans session ouverte. `makensis`
      # est fourni avec les runners Windows.
      - name: Installateur du worker
        if: runner.os == 'Windows'
        working-directory: packaging/windows
        shell: bash
        run: |
          VERSION="$(node -p "require('../../apps/desktop/src-tauri/tauri.conf.json').version")"
          makensis -DVERSION="$VERSION" nexus-worker.nsi

      - uses: actions/upload-artifact@v4
        with:
          name: nexus-worker-installer
          path: packaging/windows/*-setup.exe
          if-no-files-found: ignore
        if: runner.os == 'Windows'

      - uses: actions/upload-artifact@v4
        with:
          name: nexus-desktop-${{ runner.os }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/**/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/**/*.deb
            apps/desktop/src-tauri/target/release/bundle/**/*.msi
            apps/desktop/src-tauri/target/release/bundle/**/*-setup.exe
            apps/desktop/src-tauri/target/release/bundle/**/*.dmg
          if-no-files-found: error

  android:
    name: Android (APK)
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Build du monorepo
        run: pnpm build

      # Le keystore arrive par un secret encodé en base64 et n'est écrit que
      # dans le répertoire de travail du runner, jamais dans le dépôt. Sans lui,
      # Gradle produit un APK non signé — ce qui prouve la chaîne de
      # construction sans prouver la signature, et c'est dit comme tel.
      - name: Déposer le keystore, s'il existe
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/nexus-release.jks"
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Construire l'APK
        working-directory: services/android-worker/android
        env:
          NEXUS_KEYSTORE_PATH: ${{ runner.temp }}/nexus-release.jks
          NEXUS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NEXUS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NEXUS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # Une seule commande dans les deux cas : c'est le build Gradle qui
        # décide, en lisant l'environnement. Deux chemins d'appel voudraient
        # dire deux comportements à maintenir, et celui qu'on n'exerce pas est
        # celui qui casse.
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Dire si l'APK est signé
        run: |
          echo "## Android" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.keystore.outputs.present }}" = "true" ]; then
            echo "- APK **signé** avec le keystore fourni." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- APK **NON SIGNÉ** : aucun keystore fourni. Non installable sur un téléphone." >> "$GITHUB_STEP_SUMMARY"
          fi
          find . -name '*.apk' -printf '  - %f\t%s octets\n' >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        with:
          name: nexus-android-apk
          path: services/android-worker/android/**/*.apk
          if-no-files-found: error

name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag existant à publier (vX.Y.Z)
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  validate:
    name: Revalider la source
    uses: ./.github/workflows/ci.yml

  publish:
    name: Image, SBOM et signature
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Valider le tag et le nom d'image
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$REQUESTED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag invalide: $REQUESTED_TAG" >&2
            exit 1
          fi
          echo "RELEASE_TAG=$REQUESTED_TAG" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/api" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Se connecter à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et publier l'API
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/api.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.RELEASE_TAG }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          provenance: mode=max
          sbom: true

      - name: Installer Cosign
        uses: sigstore/cosign-installer@v3

      - name: Signer l'image sans clé statique
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - name: Installer Syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Générer les artefacts de release
        run: |
          git archive --format=tar.gz --prefix="nexus-${RELEASE_TAG}/" \
            --output="nexus-${RELEASE_TAG}.tar.gz" "$RELEASE_TAG"
          syft "$IMAGE@${{ steps.image.outputs.digest }}" \
            --output "spdx-json=nexus-${RELEASE_TAG}.sbom.spdx.json"
          sha256sum "nexus-${RELEASE_TAG}.tar.gz" \
            "nexus-${RELEASE_TAG}.sbom.spdx.json" > SHA256SUMS

      - name: Publier la release GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$RELEASE_TAG" \
            "nexus-${RELEASE_TAG}.tar.gz" \
            "nexus-${RELEASE_TAG}.sbom.spdx.json" \
            SHA256SUMS \
            --verify-tag \
            --generate-notes \
            --title "NEXUS ${RELEASE_TAG}"

# Intégration continue NEXUS.
#
# Ce workflow existe parce que son absence a coûté cher : `pnpm lint` échouait
# depuis septembre sur 95 erreurs, et personne ne le voyait — `pnpm verify`
# s'arrête au lint, donc en le lançant on ne voyait même pas les tests passer.
# Un magasin PostgreSQL entier était inutilisable sans que rien ne le signale.
#
# Deux principes de conception :
#
#   1. **Les étapes sont séparées.** `pnpm verify` enchaîne tout et s'arrête à
#      la première erreur ; ici build, lint, typecheck et tests ont chacun leur
#      étape, pour qu'un échec de lint ne cache pas un test rouge.
#   2. **Les tests qui exigent une base sont isolés dans leur propre job.** Le
#      gros de la suite tourne sur des magasins en mémoire et une base SQLite
#      temporaire, donc sans service. Mais ce qui n'est vérifié que contre une
#      doublure n'est pas vérifié : le job `persistence` monte un PostgreSQL
#      éphémère et écrit vraiment, parce que c'est précisément un défaut de
#      production invisible aux doublures qui a motivé ce workflow.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node:
    name: Monorepo TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Installer pnpm
        uses: pnpm/action-setup@v4
        with:
          # La version vient de `packageManager` dans package.json : la répéter
          # ici la ferait dériver au prochain changement.
          run_install: false

      - uses: actions/setup-node@v5
        with:
          # `.nvmrc` est la source de vérité. `engine-strict` est actif et
          # pnpm 11, ESLint 10 et Prisma 7 refusent de tourner en deçà de
          # Node 22.13 : une version plus ancienne échouerait, mais tard.
          node-version-file: .nvmrc
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      # Le client Prisma est généré, pas versionné. `build` le produit via le
      # paquet @nexus/database, mais lint et typecheck en ont besoin aussi :
      # sans lui, les types des magasins deviennent `any` et les règles
      # `no-unsafe-*` passent à côté de tout.
      - name: Générer le client Prisma
        run: pnpm db:generate

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      # `pnpm format:check` n'est volontairement pas une étape : il échoue
      # aujourd'hui sur 47 fichiers antérieurs, et le rendre bloquant
      # imposerait un reformatage massif sans rapport avec le code qui change.
      # La roadmap ne le liste pas non plus parmi les portes de la phase 0.

  mission-engine:
    name: Mission Engine (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/mission-engine
    steps:
      - uses: actions/checkout@v5

      - name: Installer uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # `--extra dev` et non `--dev` : pytest est déclaré dans
      # `[project.optional-dependencies]`, que `--dev` ne touche pas — celui-ci
      # ne vise que `[dependency-groups]`. Sans cela, `uv run pytest` échoue sur
      # un binaire absent.
      - name: Installer les dépendances
        run: uv sync --frozen --extra dev

      - name: Tests
        run: uv run pytest -q

  persistence:
    name: Magasins Prisma (PostgreSQL réel)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Un service éphémère, et non la base d'un poste : ces tests écrivent
    # vraiment. L'image suit celle du compose de développement, sinon la CI
    # validerait un PostgreSQL que personne n'exécute.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://nexus:nexus@127.0.0.1:5432/nexus_test

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      # Les paquets de l'espace de travail s'importent par leur `exports`, qui
      # pointe sur `dist/`. Sans build, `@nexus/database` ne résout pas — et le
      # cas ne se voit pas en local, où `dist/` traîne d'une construction
      # précédente. Le build produit aussi le client Prisma.
      - name: Build
        run: pnpm build

      # `migrate deploy` et non `db push` : c'est la commande du déploiement.
      # Elle vérifie donc aussi que les migrations s'appliquent dans l'ordre sur
      # une base vierge — ce qu'aucun autre job ne fait.
      - name: Appliquer les migrations
        run: pnpm --filter @nexus/database exec prisma migrate deploy

      - name: Tests d'intégration
        run: pnpm test:pg

  e2e-confirmation:
    name: Confirmation de bout en bout
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # Le seul job qui fait tourner les deux processus ensemble : l'API Node, le
    # moteur Python, PostgreSQL, et un vrai redémarrage de processus au milieu.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://nexus:nexus@127.0.0.1:5432/nexus_e2e

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Installer uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Installer les dépendances Node
        run: pnpm install --frozen-lockfile

      - name: Installer les dépendances Python
        working-directory: services/mission-engine
        run: uv sync --frozen --extra dev

      - name: Build
        run: pnpm build

      - name: Appliquer les migrations
        run: pnpm --filter @nexus/database exec prisma migrate deploy

      - name: Scénario complet
        run: pnpm --filter @nexus/api e2e:confirmation

  security:
    name: Secrets et dépendances
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          # gitleaks a besoin de l'historique pour inspecter les commits, pas
          # seulement l'arbre de travail.
          fetch-depth: 0

      - name: Rechercher des secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      # Volontairement **non bloquant**, et la raison est documentée plutôt que
      # cachée : l'audit remonte aujourd'hui 38 avis dont 2 critiques, tous
      # transitifs. Rendre l'étape bloquante immobiliserait chaque branche sur
      # des correctifs qui ne dépendent pas de ce dépôt ; la rendre silencieuse
      # reviendrait à ne pas auditer. Elle signale, et le jour où l'arriéré est
      # purgé, retirer cette ligne la rend bloquante.
      - name: Auditer les dépendances
        continue-on-error: true
        run: pnpm audit --prod --audit-level high

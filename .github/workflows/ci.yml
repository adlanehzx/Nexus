# Intégration continue NEXUS.
#
# Ce workflow existe parce que son absence a coûté cher : `pnpm lint` échouait
# depuis septembre sur 95 erreurs, et personne ne le voyait — `pnpm verify`
# s'arrête au lint, donc en le lançant on ne voyait même pas les tests passer.
# Un magasin PostgreSQL entier était inutilisable sans que rien ne le signale.
#
# Deux principes de conception :
#
#   1. **Les étapes sont séparées.** `pnpm verify` enchaîne tout et s'arrête à
#      la première erreur ; ici build, lint, typecheck et tests ont chacun leur
#      étape, pour qu'un échec de lint ne cache pas un test rouge.
#   2. **Les tests qui exigent une base sont isolés dans leur propre job.** Le
#      gros de la suite tourne sur des magasins en mémoire et une base SQLite
#      temporaire, donc sans service. Mais ce qui n'est vérifié que contre une
#      doublure n'est pas vérifié : le job `persistence` monte un PostgreSQL
#      éphémère et écrit vraiment, parce que c'est précisément un défaut de
#      production invisible aux doublures qui a motivé ce workflow.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node:
    name: Monorepo TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Installer pnpm
        uses: pnpm/action-setup@v4
        with:
          # La version vient de `packageManager` dans package.json : la répéter
          # ici la ferait dériver au prochain changement.
          run_install: false

      - uses: actions/setup-node@v5
        with:
          # `.nvmrc` est la source de vérité. `engine-strict` est actif et
          # pnpm 11, ESLint 10 et Prisma 7 refusent de tourner en deçà de
          # Node 22.13 : une version plus ancienne échouerait, mais tard.
          node-version-file: .nvmrc
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      # Le client Prisma est généré, pas versionné. `build` le produit via le
      # paquet @nexus/database, mais lint et typecheck en ont besoin aussi :
      # sans lui, les types des magasins deviennent `any` et les règles
      # `no-unsafe-*` passent à côté de tout.
      - name: Générer le client Prisma
        run: pnpm db:generate

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      # Bloquant depuis que l'arriéré est purgé. Deux catégories en sont
      # exclues, et pour des raisons différentes : les schémas générés par
      # Tauri, qu'une génération réécrirait, et la configuration que Mission
      # Engine écrit lui-même — imposer un autre style la ferait re-salir à
      # chaque modification de réglage. Voir `.prettierignore`.
      - name: Format
        run: pnpm format:check

      - name: Hygiène de publication
        run: pnpm release:check

  mission-engine:
    name: Mission Engine (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/mission-engine
    steps:
      - uses: actions/checkout@v5

      - name: Installer uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # `--extra dev` et non `--dev` : pytest est déclaré dans
      # `[project.optional-dependencies]`, que `--dev` ne touche pas — celui-ci
      # ne vise que `[dependency-groups]`. Sans cela, `uv run pytest` échoue sur
      # un binaire absent.
      - name: Installer les dépendances
        run: uv sync --frozen --extra dev

      - name: Tests
        run: uv run pytest -q

  persistence:
    name: Magasins Prisma (PostgreSQL réel)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Un service éphémère, et non la base d'un poste : ces tests écrivent
    # vraiment. L'image suit celle du compose de développement, sinon la CI
    # validerait un PostgreSQL que personne n'exécute.
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://nexus:nexus@127.0.0.1:5432/nexus_test

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      # Les paquets de l'espace de travail s'importent par leur `exports`, qui
      # pointe sur `dist/`. Sans build, `@nexus/database` ne résout pas — et le
      # cas ne se voit pas en local, où `dist/` traîne d'une construction
      # précédente. Le build produit aussi le client Prisma.
      - name: Build
        run: pnpm build

      # `migrate deploy` et non `db push` : c'est la commande du déploiement.
      # Elle vérifie donc aussi que les migrations s'appliquent dans l'ordre sur
      # une base vierge — ce qu'aucun autre job ne fait.
      - name: Appliquer les migrations
        run: pnpm --filter @nexus/database exec prisma migrate deploy

      - name: Tests d'intégration
        run: pnpm test:pg

  e2e-confirmation:
    name: Confirmation de bout en bout
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # Le seul job qui fait tourner les deux processus ensemble : l'API Node, le
    # moteur Python, PostgreSQL, et un vrai redémarrage de processus au milieu.
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://nexus:nexus@127.0.0.1:5432/nexus_e2e

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Installer uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Installer les dépendances Node
        run: pnpm install --frozen-lockfile

      - name: Installer les dépendances Python
        working-directory: services/mission-engine
        run: uv sync --frozen --extra dev

      - name: Build
        run: pnpm build

      - name: Appliquer les migrations
        run: pnpm --filter @nexus/database exec prisma migrate deploy

      - name: Scénario complet
        run: pnpm --filter @nexus/api e2e:confirmation

  e2e-chain:
    name: Chaîne d'agents de bout en bout
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # Un job distinct de `e2e-confirmation`, et non une étape de plus : les deux
    # scénarios éprouvent des chaînes différentes, et un échec doit nommer
    # laquelle. Partager le job ferait aussi que le second ne tournerait jamais
    # quand le premier tombe.
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://nexus:nexus@127.0.0.1:5432/nexus_e2e

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Installer uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Installer les dépendances Node
        run: pnpm install --frozen-lockfile

      - name: Installer les dépendances Python
        working-directory: services/mission-engine
        run: uv sync --frozen --extra dev

      # Le scénario lance le runtime ACP compilé et les magasins compilés : il
      # lit `dist`, pas les sources.
      - name: Build
        run: pnpm build

      - name: Appliquer les migrations
        run: pnpm --filter @nexus/database exec prisma migrate deploy

      - name: Scénario complet
        run: pnpm --filter @nexus/api e2e:chain

  backup-restore:
    name: Sauvegarde et restauration
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Une sauvegarde dont on n'a jamais tenté la restauration n'est pas une
    # sauvegarde : on découvre son état le jour où on en a besoin. Ce job la
    # crée puis la restaure vraiment, dans une base jetable.
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus_backup
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus_backup"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Le client doit etre de la meme version majeure que le serveur : celui de
      # la distribution est en 16 et `pg_dump` refuse un serveur 17. La CLI sait
      # se replier sur le conteneur, mais ce job doit exercer le chemin natif --
      # le repli a ses propres tests.
      - name: Installer les clients PostgreSQL 17 et SQLite
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates lsb-release sqlite3
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          # Le chemin versionne, explicitement : avec les clients 16 et 17
          # installes cote a cote, le wrapper Debian peut resoudre `pg_dump` et
          # `pg_restore` sur des versions differentes -- et `pg_restore` 16
          # refuse alors une archive ecrite par `pg_dump` 17.
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version
          /usr/lib/postgresql/17/bin/pg_restore --version

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Un `.env` minimal : la commande lit sa configuration là où une
      # installation réelle la lit, et non depuis des variables du job.
      - name: Préparer une installation jetable
        run: |
          cat > .env <<'ENV'
          NODE_ENV=development
          DATABASE_URL=postgresql://nexus:nexus@127.0.0.1:5432/nexus_backup?schema=public
          REDIS_URL=redis://127.0.0.1:6379
          ENV
          chmod 600 .env

      - name: Appliquer les migrations
        run: pnpm --filter @nexus/database exec prisma migrate deploy

      - name: Sauvegarder
        run: pnpm nexus backup --passphrase "${{ github.sha }}"

      # Le cœur du job : restaurer pour de vrai dans une base jetable, et
      # comparer à l'archive.
      - name: Vérifier que l'archive est restaurable
        run: |
          ARCHIVE=$(ls -t backups/*.nxbk | head -1)
          pnpm nexus backup --verify "$ARCHIVE" --passphrase "${{ github.sha }}"

      - name: Refuser une archive altérée
        run: |
          ARCHIVE=$(ls -t backups/*.nxbk | head -1)
          cp "$ARCHIVE" /tmp/tamper.nxbk
          node -e 'const f="/tmp/tamper.nxbk";const fs=require("node:fs");const d=fs.readFileSync(f);d[d.length-10]^=0xff;fs.writeFileSync(f,d)'
          if pnpm nexus backup --verify /tmp/tamper.nxbk --passphrase "${{ github.sha }}"; then
            echo "une archive altérée a été acceptée" >&2
            exit 1
          fi

  blank-machine:
    name: Réinstallation sur machine vide
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Le critère de réussite de la priorité 0, et le seul qui compte vraiment :
    # réinstaller sur une machine vide et retrouver missions, conversations et
    # agents. Le scénario part d'un `git clone` neuf -- aucun `.env`, aucun
    # `dist`, aucune donnée -- y déroule l'installation complète, restaure, puis
    # vérifie ce qu'il devait retrouver.
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: "5432"
      DATABASE_USER: nexus
      DATABASE_PASSWORD: nexus

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Installer uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Installer les clients PostgreSQL 17 et SQLite
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates lsb-release sqlite3
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # L'environnement Python du moteur : le semis de la mission passe par son
      # dépôt, qui est le seul à connaître son schéma.
      - name: Installer l'environnement du moteur
        working-directory: services/mission-engine
        run: uv sync --frozen --extra dev

      - name: Scénario complet
        run: bash scripts/blank-machine-restore.sh

  security:
    name: Secrets et dépendances
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          # gitleaks a besoin de l'historique pour inspecter les commits, pas
          # seulement l'arbre de travail.
          fetch-depth: 0

      - name: Rechercher des secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      # Deux étapes, deux exigences, parce que les deux niveaux n'appellent pas
      # la même réponse.
      #
      # Les critiques sont **bloquantes**. Il n'y en a plus : les deux qui
      # restaient — `proxy-addr` et `shell-quote` — sont corrigées par un
      # plancher dans `pnpm-workspace.yaml`. Cette étape est donc ce qui empêche
      # une régression, et non un vœu.
      # Les évaluations de sécurité agentique, nommées à part.
      #
      # Elles tournent déjà dans `pnpm test` du job TypeScript, mais un échec y
      # ressemblerait à n'importe quel test cassé. Ici, l'étape dit ce qu'elle
      # mesure : une barrière a cédé. `turbo run` plutôt que `pnpm --filter`,
      # pour que les paquets dont elles dépendent soient construits.
      - name: Évaluations de sécurité agentique
        run: pnpm turbo run test --filter=@nexus/security-evals

      - name: Auditer les dépendances (critique)
        run: pnpm audit --prod --audit-level critical

      # Le reste **signale sans bloquer**, et la raison est écrite plutôt que
      # cachée : trente-six avis transitifs subsistent, dont la correction ne
      # dépend pas de ce dépôt. Immobiliser chaque branche dessus ferait
      # désactiver l'étape à la première urgence ; la supprimer reviendrait à ne
      # pas auditer. Le jour où l'arriéré est purgé, il suffit de retirer
      # `continue-on-error`.
      - name: Auditer les dépendances (élevé et moindre)
        continue-on-error: true
        run: pnpm audit --prod --audit-level high

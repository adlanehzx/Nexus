# NEXUS continuous integration.
#
# Gates are separate so one lint failure cannot hide failing tests. Tests that
# need a real database use isolated jobs with disposable PostgreSQL instances;
# an in-memory double cannot validate production persistence behavior.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node:
    name: TypeScript monorepo
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          # package.json is the single source of truth for the pnpm version.
          run_install: false

      - uses: actions/setup-node@v5
        with:
          # .nvmrc is the single source of truth for Node.js.
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Lint and typecheck also require the generated Prisma client.
      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # MCP stdio isolation is enabled by default and its integration tests
      # execute a real process inside Bubblewrap.
      - name: Install MCP sandbox runtime
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: Tests
        run: pnpm test

      # Generated Tauri schemas and runtime-owned configuration are excluded.
      - name: Format
        run: pnpm format:check

      - name: Release hygiene
        run: pnpm release:check

      - name: English-only repository
        run: pnpm translation:check

  mission-engine:
    name: Mission Engine (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/mission-engine
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # pytest lives in project.optional-dependencies, hence --extra dev.
      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Tests
        run: uv run pytest -q

  persistence:
    name: Prisma stores (real PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # These tests write to a disposable service using the development image.
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://nexus:nexus@127.0.0.1:5432/nexus_test

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Workspace exports point at dist, so a clean build is required.
      - name: Build
        run: pnpm build

      # Use the production migration command against a blank database.
      - name: Apply migrations
        run: pnpm --filter @nexus/database exec prisma migrate deploy

      - name: Integration tests
        run: pnpm test:pg

  e2e-confirmation:
    name: End-to-end confirmation
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # Runs the Node API, Python engine, PostgreSQL, and a real process restart.
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://nexus:nexus@127.0.0.1:5432/nexus_e2e

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        working-directory: services/mission-engine
        run: uv sync --frozen --extra dev

      - name: Build
        run: pnpm build

      - name: Apply migrations
        run: pnpm --filter @nexus/database exec prisma migrate deploy

      - name: Full scenario
        run: pnpm --filter @nexus/api e2e:confirmation

      - name: Agent Core schedule contract (TypeScript to Python)
        run: pnpm --filter @nexus/api e2e:schedule-grant

  e2e-chain:
    name: End-to-end agent chain
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # Separate from confirmation so either execution chain can fail independently.
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://nexus:nexus@127.0.0.1:5432/nexus_e2e

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        working-directory: services/mission-engine
        run: uv sync --frozen --extra dev

      # The scenario executes compiled ACP runtime and stores from dist.
      - name: Build
        run: pnpm build

      - name: Apply migrations
        run: pnpm --filter @nexus/database exec prisma migrate deploy

      - name: Full scenario
        run: pnpm --filter @nexus/api e2e:chain

  backup-restore:
    name: Backup and restore
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # A backup is valid only after a real restore into a disposable database.
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus_backup
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus_backup"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Match the PostgreSQL client major version to the server.
      - name: Install PostgreSQL 17 and SQLite clients
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates lsb-release sqlite3
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          # Use the versioned path so dump and restore cannot resolve to different majors.
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version
          /usr/lib/postgresql/17/bin/pg_restore --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Exercise configuration from the same .env location as a real installation.
      - name: Prepare disposable installation
        run: |
          cat > .env <<'ENV'
          NODE_ENV=development
          DATABASE_URL=postgresql://nexus:nexus@127.0.0.1:5432/nexus_backup?schema=public
          REDIS_URL=redis://127.0.0.1:6379
          ENV
          chmod 600 .env

      - name: Apply migrations
        run: pnpm --filter @nexus/database exec prisma migrate deploy

      - name: Create backup
        run: pnpm nexus backup --passphrase "${{ github.sha }}"

      - name: Verify archive can be restored
        run: |
          ARCHIVE=$(ls -t backups/*.nxbk | head -1)
          pnpm nexus backup --verify "$ARCHIVE" --passphrase "${{ github.sha }}"

      - name: Reject a tampered archive
        run: |
          ARCHIVE=$(ls -t backups/*.nxbk | head -1)
          cp "$ARCHIVE" /tmp/tamper.nxbk
          node -e 'const f="/tmp/tamper.nxbk";const fs=require("node:fs");const d=fs.readFileSync(f);d[d.length-10]^=0xff;fs.writeFileSync(f,d)'
          if pnpm nexus backup --verify /tmp/tamper.nxbk --passphrase "${{ github.sha }}"; then
            echo "a tampered archive was accepted" >&2
            exit 1
          fi

  blank-machine:
    name: Blank-machine reinstall
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Proves a fresh clone can install, restore, and recover missions, conversations, and agents.
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: "5432"
      DATABASE_USER: nexus
      DATABASE_PASSWORD: nexus

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install PostgreSQL 17 and SQLite clients
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates lsb-release sqlite3
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Mission seeding uses the engine repository, which owns its schema.
      - name: Install engine environment
        working-directory: services/mission-engine
        run: uv sync --frozen --extra dev

      - name: Full scenario
        run: bash scripts/blank-machine-restore.sh

  desktop-compile:
    name: Desktop shell (compile)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Compile the shell on Linux on every push to catch platform-specific dependency mistakes.
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install WebKitGTK dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsecret-1-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build monorepo
        run: pnpm build

      # cargo check verifies cross-platform compilation; packaging belongs to release CI.
      - name: Compile desktop shell
        working-directory: apps/desktop/src-tauri
        run: cargo check --locked --all-targets

  provenance:
    name: Provenance (DCO)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Pull requests only. The existing history is unsigned and will stay so:
    # rewriting every hash of an already-merged branch would cost a great deal
    # and prove nothing.
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v5
        with:
          # Both ends are needed to enumerate the commits of the pull request;
          # a shallow clone only sees one.
          fetch-depth: 0

      # A script rather than a third-party action: twenty lines of shell beat
      # one more dependency in the chain that guards the provenance of the
      # code. This is exactly where a compromised action would do the most
      # damage.
      - name: Check sign-offs
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          while read -r sha; do
            [ -n "$sha" ] || continue
            if ! git log -1 --format='%(trailers:key=Signed-off-by)' "$sha" | grep -q .; then
              echo "::error::$sha has no Signed-off-by: $(git log -1 --format='%s' "$sha")"
              missing=$((missing + 1))
            fi
          done <<< "$(git rev-list "$BASE..$HEAD")"

          if [ "$missing" -gt 0 ]; then
            {
              echo "### $missing commit(s) without \`Signed-off-by\`"
              echo ""
              echo "The DCO certifies that you have the right to submit what you submit."
              echo "For machine-generated content, **you** are the one certifying it."
              echo ""
              echo "To fix this branch:"
              echo ""
              echo '```sh'
              echo "git rebase --signoff $BASE"
              echo "git push --force-with-lease"
              echo '```'
              echo ""
              echo "And for the next ones: \`git commit -s\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Every commit is signed off." >> "$GITHUB_STEP_SUMMARY"

  security:
    name: Secrets and dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          # gitleaks needs history, not only the working tree.
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Keep agentic security evaluations visible as a dedicated gate.
      - name: Agentic security evaluations
        run: pnpm turbo run test --filter=@nexus/security-evals

      - name: Audit dependencies (critical)
        run: pnpm audit --prod --audit-level critical

      # Remaining transitive advisories are reported without blocking until upstream fixes land.
      - name: Audit dependencies (high and lower)
        continue-on-error: true
        run: pnpm audit --prod --audit-level high

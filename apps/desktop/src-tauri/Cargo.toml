[package]
name = "nexus-desktop"
version = "1.0.0"
edition = "2021"
description = "Coquille native NEXUS : Windows, macOS et Linux"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Trousseau du système, **par plateforme**.
#
# La version précédente déclarait `features = ["windows-native"]` dans les
# dépendances communes, ce qui rendait la coquille inconstructible ailleurs que
# sur Windows — et donc les paquets AppImage, deb et dmg impossibles. Le besoin
# est le même partout : les jetons NEXUS n'ont rien à faire dans un fichier de
# configuration ni dans le stockage du moteur de rendu. C'est le magasin qui
# change de nom.
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Secret Service : c'est GNOME Keyring ou KWallet, selon le bureau installé.
keyring = { version = "3", features = ["sync-secret-service"] }

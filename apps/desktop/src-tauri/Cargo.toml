[package]
name = "nexus-desktop"
version = "1.0.0"
edition = "2021"
description = "Coquille native NEXUS pour Windows"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
# Gestionnaire d'identifiants de Windows. Les jetons NEXUS n'ont rien à faire
# dans un fichier de configuration ni dans le stockage du moteur de rendu.
keyring = { version = "3", features = ["windows-native"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

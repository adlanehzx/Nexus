[package]
name = "nexus-desktop"
version = "1.0.0"
edition = "2021"
description = "NEXUS native shell for Windows, macOS, and Linux"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Use the native system keyring on each platform. NEXUS tokens must never be
# stored in configuration files or renderer storage.
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Secret Service is backed by GNOME Keyring or KWallet, depending on the desktop.
keyring = { version = "3", features = ["sync-secret-service"] }

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      No remote fonts, scripts, or stylesheets. Everything is bundled. A desktop
      shell that loads code from the Internet hands control to that domain.

      Tauri v2 uses `ipc:` and `http://ipc.localhost` to connect the window to
      its Rust backend. Both this policy and tauri.conf.json must permit them.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self' ipc: http://ipc.localhost https: wss:"
    />
    <!-- Bundled locally; the CSP permits no third-party source. -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>NEXUS</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

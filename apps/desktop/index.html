<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      Aucune ressource distante : ni police, ni script, ni feuille de style.
      Tout est empaqueté. Une coquille de bureau qui charge du code depuis
      Internet donne à quiconque contrôle ce domaine la main sur la machine.

      `ipc:` et `http://ipc.localhost` ne sont pas une ouverture vers le réseau :
      c'est ainsi que Tauri v2 fait dialoguer la fenêtre avec son propre backend
      Rust — le second sous Windows, le premier ailleurs. Sans eux, le moindre
      `invoke` est refusé par cette politique, et l'application échoue dès la
      lecture du trousseau, sans jamais atteindre le cœur.

      `tauri.conf.json` les déclarait déjà ; cette balise, non. Le navigateur
      applique l'intersection des deux, donc la plus restrictive l'emportait.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self' ipc: http://ipc.localhost https: wss:"
    />
    <!-- Servi depuis le paquet, jamais depuis un domaine tiers : la CSP
         ci-dessus n'autorise que « self ». -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>NEXUS</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

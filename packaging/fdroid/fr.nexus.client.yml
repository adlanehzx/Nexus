License: AGPL-3.0-or-later
AuthorName: NEXUS Team
SourceCode: https://github.com/nexus-assistant/nexus
IssueTracker: https://github.com/nexus-assistant/nexus/issues
Summary: Privacy-first companion client for NEXUS personal intelligence OS
Description: |-
  NEXUS Mobile Companion allows you to monitor, supervise, and interact with
  your self-hosted NEXUS assistant instance from Android devices and Wear OS smartwatches.

  Features:
  - Real-time task progress and status monitoring
  - Hardware-isolated tactile approval for sensitive actions
  - Minimal-distraction vehicle mode for safe hands-free interaction
  - Local voice dictation and speech synthesis
  - Single-use QR pairing without leaking tokens
  - Complete privacy: zero third-party telemetry, all keys stored in Android Keystore.

RepoType: git
Repo: https://github.com/nexus-assistant/nexus.git


[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "nexus-mission-engine"
version = "0.3.0"
description = "NEXUS durable multi-agent orchestration for native ACP profiles"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "uvicorn>=0.34,<1",
  # Verify API-issued Ed25519 service tokens with a proven implementation.
  # The engine holds only the public key and never issues tokens.
  "cryptography>=44,<47",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8.3,<9"]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8.3,<9"]

[project.scripts]
nexus-mission-engine = "nexus_engine.api:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# ── Worker Android NEXUS ────────────────────────────────────────────────────
# AUCUN SECRET ICI. Ce fichier est versionne ; la cle de l'appareil vit dans le
# magasin de cles d'Android et la signature de l'APK est configuree hors depot.

org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# Architecture historique de React Native. Le module natif est un
# ReactContextBaseJavaModule classique et le worker n'a aucun composant
# d'interface natif : migrer couterait une reecriture du pont sans rien
# apporter. Voir NexusWorkerApplication.kt.
newArchEnabled=false

# Hermes : moteur JavaScript par defaut de React Native, plus econome en
# memoire que JSC — ce qui compte sur un telephone qui doit rester connecte en
# arriere-plan sans se faire tuer par le systeme.
hermesEnabled=true

# Seules les architectures reellement visees. Le Redmi Note 10S est en arm64.
reactNativeArchitectures=armeabi-v7a,arm64-v8a

# ── NEXUS Android worker ────────────────────────────────────────────────────
# No secrets. The device key remains in Android Keystore and APK signing is external.

org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# Keep the legacy React Native architecture until the native bridge is migrated.
newArchEnabled=false

# Hermes reduces memory pressure for a worker that remains connected in background.
hermesEnabled=true

# Supported device architectures.
reactNativeArchitectures=armeabi-v7a,arm64-v8a
